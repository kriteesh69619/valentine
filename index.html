<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Poppins,sans-serif;
}

body{
  height:100vh;
  overflow:hidden;
}

/* ---------- PAGE 1 ---------- */
#page1{
  height:100vh;
  background:linear-gradient(135deg,#ff4d6d,#ffb3c6);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  position:relative;
}

.container{
  text-align:center;
}

.heart{
  font-size:80px;
  animation:beat 1s infinite;
}

@keyframes beat{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.3);}
}

button{
  padding:12px 28px;
  font-size:18px;
  border-radius:30px;
  border:none;
  cursor:pointer;
}

#yes{
  background:white;
  color:#ff4d6d;
  margin:20px;
}

/* These two will MOVE AROUND THE PAGE */
#no, #reject{
  position:fixed;
  background:transparent;
  color:white;
  border:2px solid white;
}

/* ---------- PAGE 2 ---------- */
#page2{
  display:none;
  height:100vh;
  background:url("bg.jpeg") center/cover no-repeat;
}

.overlay{
  height:100%;
  background:rgba(0,0,0,0.6);
  display:flex;
  align-items:center;
  justify-content:center;
}

.content{
  width:90%;
  max-width:1000px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:white;
}

.memes{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.memes img{
  width:160px;
  border-radius:15px;
}

.center-text{
  text-align:center;
  font-size:2.3rem;
  font-weight:600;
}

/* ---------- FLOATING HEARTS ---------- */
.floating-heart{
  position:absolute;
  bottom:-20px;
  font-size:24px;
  animation:floatUp 6s linear infinite;
}

@keyframes floatUp{
  to{
    transform:translateY(-120vh);
    opacity:0;
  }
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="page1">
  <div class="container">
    <div class="heart">❤️</div>
    <h1>Will you be my Valentine?</h1>
    <button id="yes">Yes 💘</button>
  </div>

  <button id="no">No 💔</button>
  <button id="reject">I reject ❌</button>
</div>

<!-- PAGE 2 -->
<div id="page2">
  <div class="overlay">
    <div class="content">
      <div class="memes">
        <img src="meme1.jpeg">
        <img src="meme2.jpeg">
      </div>

      <div class="center-text">
        banda toh kaam ka hun 🥰🥰
      </div>

      <div class="memes">
        <img src="meme3.jpeg">
      </div>
    </div>
  </div>
</div>

<audio id="bgMusic" preload="auto" loop>
  <source src="banda_kaam_ka.mp3" type="audio/mpeg">
</audio>

<script>
const music = document.getElementById("bgMusic");
const yesBtn = document.getElementById("yes");

/* YES */
yesBtn.onclick = async () => {
  try { await music.play(); } catch(e){}
  document.getElementById("page1").style.display="none";
  document.getElementById("page2").style.display="block";
};

/* DODGE ACROSS FULL PAGE */
function fullPageDodge(btn){
  let step = 0;

  const positions = [
    () => { // RIGHT
      btn.style.top = "50%";
      btn.style.right = "20px";
      btn.style.left = "";
      btn.style.bottom = "";
    },
    () => { // LEFT
      btn.style.top = "50%";
      btn.style.left = "20px";
      btn.style.right = "";
      btn.style.bottom = "";
    },
    () => { // TOP
      btn.style.top = "20px";
      btn.style.left = "50%";
      btn.style.right = "";
      btn.style.bottom = "";
    },
    () => { // BOTTOM
      btn.style.bottom = "20px";
      btn.style.left = "50%";
      btn.style.top = "";
      btn.style.right = "";
    }
  ];

  btn.addEventListener("mouseenter", ()=>{
    if(step < positions.length){
      positions[step]();
      step++;
    } else {
      btn.remove();
    }
  });
}

/* INITIAL POSITIONS */
document.getElementById("no").style.top = "60%";
document.getElementById("no").style.left = "55%";

document.getElementById("reject").style.top = "60%";
document.getElementById("reject").style.left = "35%";

fullPageDodge(document.getElementById("no"));
fullPageDodge(document.getElementById("reject"));

/* FLOATING HEARTS */
setInterval(()=>{
  const h=document.createElement("div");
  h.className="floating-heart";
  h.innerHTML="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(Math.random()*3+3)+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
},400);
</script>

</body>
</html>
